[project]
name = "check-file-exists"
version = "0.1.0"
description = "Nagios plugin to alert if a file is/is not present"
authors = [
    {name = "Patrick St. Jean",email = "stjeanp@pat-st-jean.com"}
]
readme = "README.md"
requires-python = ">=3.11.0,<4.0"
dependencies = [
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
files = ["check_file_exists.py", "tests/"]

[tool.pylint]
ignore-patterns = ["^\\.git"]
recursive = true
source-roots = ["."]

[tool.black]
check = true
diff = true

[tool.pytest]
pythonpath = ["."]
addopts = ["--cov", "--cov-append", "--cov-report="]


[dependency-groups]
dev = [
    "black (>=25.12.0,<28.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pylint (>=4.0.4,<5.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "mypy (>=1.19.1,<3.0.0)",
    "pip-audit (>=2.10.0,<3.0.0)"
]
